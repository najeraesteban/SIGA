<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Sistema de Gestión de Alquileres para Inmobiliarias</title>
    <meta name="description" content="Administrá propiedades, contratos, pagos y vencimientos de tu inmobiliaria desde un solo panel.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SIGA</h1>
        <p>Sistema Integral de Gestión de Alquileres</p>
    </header>

    <nav>
        <ul>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#propiedades">Propiedades</a></li>
            <li><a href="#contratos">Contratos</a></li>
            <li><a href="#propietarios">Propietarios</a></li>
            <li><a href="#pagos">Pagos</a></li>
        </ul>
    </nav>

    <main>
        <section id="dashboard">
            <h2>Panel General</h2>
           
        </section>

        <section id="propiedades">
            <h2>Propiedades</h2>
            <!-- Cards de propiedades con Flexbox -->
        </section>

        <section id="contratos">
            <h2>Contratos</h2>
            <!-- Listado de contratos -->
        </section>

        <section id="propietarios">
            <h2>Propietarios e Inquilinos</h2>
        </section>

        <section id="pagos">
            <h2>Pagos y Vencimientos</h2>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIGA - Todos los derechos reservados</p>
    </footer>

</body>
</html>
